<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form for the WDD 131 Week 05 assignment.">
  <meta name="author" content="Luis Regnier">
  <title>Product Review Form | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
  <script src="scripts/getdates.js" defer></script>
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Week 05 Assignment</p>
    <h1>Product Review Form</h1>
    <p class="intro">Share a quick review about one of the products below.</p>
  </header>

  <main>
    <form class="review-form" method="get" action="review.html">
      <div class="form-group">
        <label for="productName">Product Name *</label>
        <select id="productName" name="productName" required>
          <option value="" selected disabled>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>Overall Rating *</legend>
        <div class="rating-group">
          <label for="rating1">☆<input type="radio" id="rating1" name="rating" value="1" required></label>
          <label for="rating2">☆☆<input type="radio" id="rating2" name="rating" value="2" required></label>
          <label for="rating3">☆☆☆<input type="radio" id="rating3" name="rating" value="3" required></label>
          <label for="rating4">☆☆☆☆<input type="radio" id="rating4" name="rating" value="4" required></label>
          <label for="rating5">☆☆☆☆☆<input type="radio" id="rating5" name="rating" value="5" required></label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="installDate">Date of Installation *</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="form-group">
        <legend>Useful Features</legend>
        <div class="checkbox-group">
          <label for="durability"><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
          <label for="easeOfUse"><input type="checkbox" id="easeOfUse" name="features" value="Ease of Use"> Ease of Use</label>
          <label for="performance"><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
          <label for="design"><input type="checkbox" id="design" name="features" value="Design"> Design</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="writtenReview">Written Review</label>
        <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Write any comments here..."></textarea>
      </div>

      <div class="form-group">
        <label for="userName">User Name</label>
        <input type="text" id="userName" name="userName" placeholder="Your name">
      </div>

      <input class="submit-button" type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>© <span id="currentyear"></span> Luis Regnier 🧑‍💻 Mexico</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
